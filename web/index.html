  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen">
    <div id="google_translate_element" style="display:none"></div>

    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript">
      // Efficient observer to enforce zero banner without CPU timer polling
      (function() {
        function suppressBanner() {
          if (document.body) {
            if (document.body.style.top && document.body.style.top !== '0px') document.body.style.top = '0px';
            if (document.body.style.position && document.body.style.position !== 'static') document.body.style.position = 'static';
          }
          var banners = document.querySelectorAll('.goog-te-banner-frame, iframe.skiptranslate, iframe[id=":1.container"], iframe[name=":1.container"]');
          for (var i = 0; i < banners.length; i++) {
            banners[i].style.display = 'none';
            banners[i].style.visibility = 'hidden';
            banners[i].style.height = '0px';
          }
        }
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(suppressBanner);
          observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
        }
      })();

      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,ta,kn,te,bn,mr,ml,gu,pa,or,as',
            autoDisplay: false
          }, 'google_translate_element');
        }
      };

      // Non-blocking deferred loading of translation library
      window.initGoogleTranslateScript = function() {
        if (document.getElementById('google-translate-script')) return;
        var s = document.createElement('script');
        s.id = 'google-translate-script';
        s.type = 'text/javascript';
        s.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        s.async = true;
        document.body.appendChild(s);
      };

      // Load when non-English language requested or after window load idle
      try {
        var savedLang = localStorage.getItem('di_language');
        if (savedLang && savedLang !== 'en') {
          window.initGoogleTranslateScript();
        } else if ('requestIdleCallback' in window) {
          requestIdleCallback(function() {
            window.addEventListener('load', function() {
              setTimeout(window.initGoogleTranslateScript, 3000);
            });
          });
        } else {
          window.addEventListener('load', function() {
            setTimeout(window.initGoogleTranslateScript, 3500);
          });
        }
      } catch (e) {
        window.addEventListener('load', window.initGoogleTranslateScript);
      }
    </script>
